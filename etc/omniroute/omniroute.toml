# xccode private OmniRoute — config template (XC-CODE-001 §4.5, §14).
#
# This is the canonical source of the xccode-specific values for the private OmniRoute instance;
# the installer renders it into the pinned OmniRoute release's native config format at install time
# (same install method and pin rule as aiOS §23). It is a template: no provider endpoint, key, or
# credential lives here. The operator supplies them with `xccode secrets set`; OmniRoute decrypts
# them from systemd-creds at start and they never touch this repository.
#
# Four pools, two providers deep, loopback only, own compression disabled (aiOS §8.6, D28).
# The default routing table backs every pool with OpenCode Zen models instead of Ollama Cloud.

[server]
bind = "127.0.0.1"   # loopback only: xcroute reaches the API, marius the dashboard (§14)
port = 18128

[compression]
enabled = false      # the Caveman skill is the only compression layer; two lossy compressors never run in series

[[pools]]
name = "coding-strong"
providers = 2        # failover within the pool; nothing below this floor ever touches code (§4.4)

[[pools]]
name = "coding-fast"
providers = 2

[[pools]]
name = "reasoning"
providers = 2

[[pools]]
name = "fast"
providers = 2

# Default routing table — each pool maps to one OpenCode Zen model.
# The operator still adds the opencode-zen provider and the OPENCODE_API_KEY in OmniRoute;
# these lines only describe the intended model mapping, not credentials.
[[routes]]
pool = "fast"
provider = "opencode-zen"
model = "deepseek-v4-flash"

[[routes]]
pool = "coding-fast"
provider = "opencode-zen"
model = "glm-5.2"

[[routes]]
pool = "coding-strong"
provider = "opencode-zen"
model = "kimi-k3"

[[routes]]
pool = "reasoning"
provider = "opencode-zen"
model = "deepseek-v4-pro"
