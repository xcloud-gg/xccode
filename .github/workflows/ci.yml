name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'
      - run: ruff check .
      - run: pytest -q
      - name: secret scan and no-internal-name check
        env:
          XCCODE_INTERNAL_NAMES: ${{ secrets.XCCODE_INTERNAL_NAMES }}
        run: python tools/ci_checks.py
