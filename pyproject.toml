[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xccode"
version = "0.0.1"
description = "Standalone coding stack with an operations profile and a P3 approval gate"
requires-python = ">=3.13"
dependencies = ["argon2-cffi>=23.1"]

[project.scripts]
xccode = "xccode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/xccode/tiers.py" = ["E501"]
